<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeachingTracker Pro - Attendance Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --dark: #0f172a;
      --darker: #020617;
      --surface: #1e293b;
      --surface-light: #334155;
      --border: #475569;
      --text: #f1f5f9;
      --text-muted: #cbd5e1;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(71, 85, 105, 0.2);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: var(--bg-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .header-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      background: rgba(52, 62, 84, 0.5);
      padding: 6px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .mode-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--bg-gradient);
      color: white;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(99, 102, 241, 0.1);
      color: var(--primary-light);
      border: 1px solid var(--primary-light);
    }

    .btn-secondary:hover {
      background: rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }

    .btn-sm { padding: 8px 14px; font-size: 12px; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    /* MAIN CONTAINER */
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 40px;
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(52, 62, 84, 0.5) 0%, rgba(31, 41, 55, 0.3) 100%);
      border: 1px solid rgba(99, 102, 241, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .stat-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-4px);
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      background: var(--bg-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 100px 40px;
    }

    .empty-icon {
      font-size: 120px;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .empty-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .empty-text {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(99, 102, 241, 0.1);
      border-radius: 24px;
      padding: 40px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* FORM */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-input, .form-select, .form-time {
      width: 100%;
      padding: 14px 16px;
      background: rgba(52, 62, 84, 0.5);
      border: 2px solid rgba(99, 102, 241, 0.1);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s;
    }

    .form-input:focus, .form-select:focus, .form-time:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(52, 62, 84, 0.8);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    /* CHECKBOX GROUP */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(52, 62, 84, 0.3);
      border-radius: 8px;
      border: 1px solid rgba(99, 102, 241, 0.1);
      transition: all 0.3s;
    }

    .checkbox-item:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: var(--primary);
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .checkbox-item label {
      cursor: pointer;
      user-select: none;
      flex: 1;
      font-size: 14px;
    }

    /* TIME DISPLAY */
    .time-display {
      margin-top: 12px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 8px;
      border-left: 3px solid var(--success);
      display: none;
      font-size: 14px;
      color: var(--text);
    }

    .time-display.show {
      display: block;
    }

    /* ACTIONS */
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .form-actions .btn {
      flex: 1;
    }

    /* ERROR MESSAGE */
    .error-message {
      color: var(--danger);
      font-size: 12px;
      margin-top: 8px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--danger);
      border-radius: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* BATCH ITEMS */
    .batch-item {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(118, 75, 162, 0.05) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.3s;
    }

    .batch-item:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(118, 75, 162, 0.08) 100%);
    }

    .batch-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .batch-meta {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .batch-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 16px 24px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
      animation: slideInUp 0.4s ease;
      z-index: 3000;
    }

    @keyframes slideInUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      header { padding: 16px 20px; }
      .container { padding: 20px; }
      .title { font-size: 28px; }
      .modal { width: 95%; padding: 24px; }
      .checkbox-group { grid-template-columns: 1fr; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">✨ TeachingTracker</div>
  <div class="header-right">
    <div class="mode-switch">
      <button class="mode-btn active" onclick="switchMode('online')">🌐 Online</button>
      <button class="mode-btn" onclick="switchMode('offline')">📍 Offline</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openBatchModal()">+ New Batch</button>
  </div>
</header>

<div class="container">
  <div class="title">Attendance Tracker</div>
  <div class="subtitle">Professional attendance management for your teaching batches</div>

  <div class="stats-grid" id="stats"></div>

  <div id="empty-state" class="empty-state">
    <div class="empty-icon">📚</div>
    <div class="empty-title">No Batches Yet</div>
    <div class="empty-text">Create your first batch to get started with attendance tracking</div>
    <button class="btn btn-primary" onclick="openBatchModal()">Create First Batch</button>
  </div>

  <div id="batches-container" class="hidden">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">Your Batches</h2>
    <div id="batches-list"></div>
  </div>
</div>

<!-- BATCH MODAL -->
<div id="batch-modal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Create New Batch</div>

    <div class="form-group">
      <label class="form-label">Grade Level</label>
      <select id="grade" class="form-select">
        <option value="">Select Grade...</option>
        <option value="3">Grade 3</option>
        <option value="4">Grade 4</option>
        <option value="5">Grade 5</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Batch Type</label>
      <select id="batch-type" class="form-select">
        <option value="">Select Batch Type...</option>
        <option value="Batch 1">Batch 1</option>
        <option value="Batch 2">Batch 2</option>
        <option value="Batch 3">Batch 3</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Classes Per Week</label>
      <select id="classes-per-week" class="form-select" onchange="updateDaysList()">
        <option value="">How many days per week?</option>
        <option value="1">1 day</option>
        <option value="2">2 days</option>
        <option value="3">3 days</option>
        <option value="4">4 days</option>
        <option value="5">5 days</option>
      </select>
    </div>

    <div class="form-group" id="days-group" style="display: none;">
      <label class="form-label">Select Days</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="day-mon" value="Monday" onchange="updateSelectedDays()">
          <label for="day-mon">Monday</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="day-tue" value="Tuesday" onchange="updateSelectedDays()">
          <label for="day-tue">Tuesday</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="day-wed" value="Wednesday" onchange="updateSelectedDays()">
          <label for="day-wed">Wednesday</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="day-thu" value="Thursday" onchange="updateSelectedDays()">
          <label for="day-thu">Thursday</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="day-fri" value="Friday" onchange="updateSelectedDays()">
          <label for="day-fri">Friday</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="day-sat" value="Saturday" onchange="updateSelectedDays()">
          <label for="day-sat">Saturday</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="day-sun" value="Sunday" onchange="updateSelectedDays()">
          <label for="day-sun">Sunday</label>
        </div>
      </div>
      <div id="selected-days" style="margin-top: 12px; padding: 12px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; border-left: 3px solid var(--success); display: none;">
        <span style="font-size: 12px; color: var(--text-muted);">Selected: </span><span id="days-display" style="color: var(--text); font-weight: 600;"></span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Class Time</label>
      <input type="time" id="class-time" class="form-time" onchange="displayTime()">
      <div id="time-display" class="time-display">
        <span id="time-text"></span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Class Duration</label>
      <select id="duration" class="form-select">
        <option value="">Select duration...</option>
        <option value="30">30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">1 hour</option>
        <option value="75">1.5 hours</option>
        <option value="90">1.5 hours</option>
        <option value="120">2 hours</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Additional Notes (Optional)</label>
      <input type="text" id="batch-notes" class="form-input" placeholder="e.g., Advanced level, Zoom link...">
    </div>

    <div class="error-message" id="error-message">Please fill all required fields</div>

    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBatch()">Create Batch</button>
    </div>
  </div>
</div>

<script>
let appData = { online: { batches: [], students: [], classes: {} }, offline: { batches: [], students: [], classes: {} } };
let currentMode = 'online';
let selectedDays = [];

function currentData() { return appData[currentMode]; }

function loadState() {
  const saved = localStorage.getItem('teachingTrackerPro');
  if (saved) appData = JSON.parse(saved);
  renderUI();
}

function saveState() {
  localStorage.setItem('teachingTrackerPro', JSON.stringify(appData));
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderUI();
  toast(`✓ Switched to ${mode.toUpperCase()} batches`);
}

function openBatchModal() {
  selectedDays = [];
  document.getElementById('grade').value = '';
  document.getElementById('batch-type').value = '';
  document.getElementById('classes-per-week').value = '';
  document.getElementById('class-time').value = '';
  document.getElementById('duration').value = '';
  document.getElementById('batch-notes').value = '';
  document.getElementById('error-message').classList.remove('show');
  document.getElementById('time-display').classList.remove('show');
  document.querySelectorAll('.checkbox-item input').forEach(c => c.checked = false);
  document.getElementById('days-group').style.display = 'none';
  document.getElementById('selected-days').style.display = 'none';
  document.getElementById('batch-modal').classList.add('active');
}

function updateDaysList() {
  const count = parseInt(document.getElementById('classes-per-week').value);
  if (count > 0) {
    document.getElementById('days-group').style.display = 'block';
  } else {
    document.getElementById('days-group').style.display = 'none';
  }
}

function updateSelectedDays() {
  selectedDays = [];
  document.querySelectorAll('.checkbox-item input:checked').forEach(c => {
    selectedDays.push(c.value);
  });
  
  if (selectedDays.length > 0) {
    document.getElementById('selected-days').style.display = 'block';
    document.getElementById('days-display').textContent = selectedDays.join(', ');
  } else {
    document.getElementById('selected-days').style.display = 'none';
  }
}

function displayTime() {
  const timeInput = document.getElementById('class-time').value;
  if (timeInput) {
    const [hours, minutes] = timeInput.split(':');
    const hour = parseInt(hours);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    const displayHour = hour % 12 || 12;
    const displayTime = `${displayHour}:${minutes} ${ampm}`;
    document.getElementById('time-text').textContent = `Time set: ${displayTime}`;
    document.getElementById('time-display').classList.add('show');
  } else {
    document.getElementById('time-display').classList.remove('show');
  }
}

function saveBatch() {
  const grade = document.getElementById('grade').value;
  const batchType = document.getElementById('batch-type').value;
  const time = document.getElementById('class-time').value;
  const duration = document.getElementById('duration').value;
  const notes = document.getElementById('batch-notes').value;

  // Check all required fields
  if (!grade || !batchType || selectedDays.length === 0 || !time || !duration) {
    document.getElementById('error-message').classList.add('show');
    return;
  }

  // Hide error message if all is good
  document.getElementById('error-message').classList.remove('show');

  const batchName = `Grade ${grade} - ${batchType}`;
  const [hours, minutes] = time.split(':');
  const hour = parseInt(hours);
  const ampm = hour >= 12 ? 'PM' : 'AM';
  const displayHour = hour % 12 || 12;
  const displayTime = `${displayHour}:${minutes} ${ampm}`;
  const schedule = `${selectedDays.join(', ')} at ${displayTime} (${duration} min)`;

  const batch = {
    id: Date.now().toString(),
    name: batchName,
    grade,
    batchType,
    schedule,
    days: selectedDays,
    time,
    duration,
    notes,
    createdAt: new Date().toISOString()
  };

  currentData().batches.push(batch);
  saveState();
  closeModal();
  renderUI();
  toast(`✓ ${batchName} created successfully!`);
}

function deleteBatch(batchId) {
  if (!confirm('Delete this batch? All students will be removed.')) return;
  currentData().batches = currentData().batches.filter(b => b.id !== batchId);
  currentData().students = currentData().students.filter(s => s.batchId !== batchId);
  saveState();
  renderUI();
  toast('✓ Batch deleted');
}

function closeModal(e) {
  if (e && e.target.id !== 'batch-modal') return;
  document.getElementById('batch-modal').classList.remove('active');
}

function renderUI() {
  const data = currentData();
  const stats = document.getElementById('stats');
  const emptyState = document.getElementById('empty-state');
  const batchesContainer = document.getElementById('batches-container');
  const batchesList = document.getElementById('batches-list');

  const totalBatches = data.batches.length;
  const totalStudents = data.students.length;
  const totalClasses = Object.keys(data.classes).length;

  stats.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${totalBatches}</div>
      <div class="stat-label">Batches</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${totalStudents}</div>
      <div class="stat-label">Students</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${totalClasses}</div>
      <div class="stat-label">Classes</div>
    </div>
  `;

  if (totalBatches === 0) {
    emptyState.classList.remove('hidden');
    batchesContainer.classList.add('hidden');
  } else {
    emptyState.classList.add('hidden');
    batchesContainer.classList.remove('hidden');

    batchesList.innerHTML = data.batches.map(batch => `
      <div class="batch-item">
        <div class="batch-name">${batch.name}</div>
        <div class="batch-meta">
          <span>📅 ${batch.schedule}</span>
          <span>👥 ${data.students.filter(s => s.batchId === batch.id).length} students</span>
        </div>
        ${batch.notes ? `<div style="margin-top: 8px; font-size: 12px; color: var(--text-muted);">📝 ${batch.notes}</div>` : ''}
        <div class="batch-actions">
          <button class="btn btn-secondary btn-sm" onclick="">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteBatch('${batch.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }
}

function toast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

loadState();
</script>

</body>
</html>
